<div id="bi13-highlevel-wrap" style="position:relative;width:100%;line-height:0;background:#161616;overflow-x:clip;-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;">
  <iframe
    id="bi13-highlevel-frame"
    src="https://elenasamanchuk.github.io/bi13-highlevel/?v=20260817-25"
    title="BI13 — мобильная съёмка"
    loading="eager"
    scrolling="no"
    tabindex="-1"
    style="width:100%;border:none;display:block;min-height:600px;overflow:hidden;background:#161616;pointer-events:none;-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none;"
  ></iframe>
  <div
    id="bi13-highlevel-shield"
    style="position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;touch-action:pan-y pan-x manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;"
  ></div>
</div>
<script>
(function () {
  var RESIZE_TYPE = 'bi13-highlevel-resize';
  var PING_TYPE = 'bi13-highlevel-ping';
  var SCROLL_TYPE = 'bi13-scroll';
  var VIEWPORT_TYPE = 'bi13-highlevel-viewport';
  var WIDTH_TYPE = 'bi13-highlevel-width';
  var CLICK_TYPE = 'bi13-highlevel-click';
  var HRECTS_TYPE = 'bi13-hrects';

  var wrap = document.getElementById('bi13-highlevel-wrap');
  var iframe = document.getElementById('bi13-highlevel-frame');
  var shield = document.getElementById('bi13-highlevel-shield');
  if (!iframe || !wrap || !shield) return;

  var viewportTimer = 0;
  var hrects = [];
  var rowIndex = -1;
  var holeOpen = false;
  var hDragged = false;
  var gestureStartX = 0;
  var gestureStartY = 0;

  iframe.setAttribute('tabindex', '-1');
  iframe.addEventListener('focus', function (event) {
    event.preventDefault();
    iframe.blur();
  });

  function sendWidth() {
    var width = Math.round(wrap.getBoundingClientRect().width || wrap.clientWidth || 0);
    if (!width) return;
    try {
      iframe.contentWindow.postMessage({ type: WIDTH_TYPE, width: width }, '*');
    } catch (e) {}
  }

  function applyHeight(height) {
    if (!height || height < 100) return;
    iframe.style.height = height + 'px';
  }

  function sendViewportNow() {
    var rect = iframe.getBoundingClientRect();
    var vv = window.visualViewport;
    var viewHeight = vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight || 0);
    var top = Math.max(0, -rect.top);
    try {
      iframe.contentWindow.postMessage({
        type: VIEWPORT_TYPE,
        top: Math.round(top),
        height: Math.round(viewHeight)
      }, '*');
    } catch (e) {}
  }

  function sendViewport() {
    if (viewportTimer) return;
    viewportTimer = setTimeout(function () {
      viewportTimer = 0;
      sendViewportNow();
    }, 80);
  }

  function scrollToOffset(offset) {
    var rect = iframe.getBoundingClientRect();
    var y =
      (window.scrollY || window.pageYOffset || 0) +
      rect.top +
      (Number(offset) || 0);
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({
      top: Math.max(0, y),
      behavior: reduced ? 'auto' : 'smooth'
    });
  }

  function ping() {
    try {
      iframe.contentWindow.postMessage({ type: PING_TYPE }, '*');
    } catch (e) {}
  }

  function iframePoint(clientX, clientY) {
    var rect = iframe.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function hitRow(clientX, clientY) {
    for (var j = 0; j < hrects.length; j++) {
      var r = hrects[j];
      if (clientX >= r.left && clientX <= r.left + r.width &&
          clientY >= r.top && clientY <= r.top + r.height) {
        return r.i != null ? r.i : j;
      }
    }
    return -1;
  }

  function resetPointer() {
    rowIndex = -1;
    hDragged = false;
  }

  function openHole() {
    if (holeOpen) return;
    holeOpen = true;
    shield.style.pointerEvents = 'none';
    iframe.style.pointerEvents = 'auto';
  }

  function closeHole() {
    if (!holeOpen) return;
    holeOpen = false;
    shield.style.pointerEvents = '';
    iframe.style.pointerEvents = 'none';
  }

  function forwardClick(clientX, clientY) {
    var pt = iframePoint(clientX, clientY);
    if (!pt) return;
    try {
      iframe.contentWindow.postMessage({ type: CLICK_TYPE, x: pt.x, y: pt.y }, '*');
    } catch (e) {}
  }

  shield.addEventListener('pointerdown', function (event) {
    hDragged = false;
    gestureStartX = event.clientX;
    gestureStartY = event.clientY;
    rowIndex = hitRow(event.clientX, event.clientY);
    if (rowIndex >= 0) {
      openHole();
    }
  }, { passive: true });

  window.addEventListener('pointermove', function (event) {
    if (!holeOpen) return;
    if (Math.abs(event.clientX - gestureStartX) > 8 || Math.abs(event.clientY - gestureStartY) > 8) {
      hDragged = true;
    }
  }, { passive: true });

  function onGestureEnd() {
    if (holeOpen) {
      if (rowIndex >= 0 && !hDragged) {
        forwardClick(gestureStartX, gestureStartY);
      }
      closeHole();
    }
    resetPointer();
  }

  window.addEventListener('pointerup', onGestureEnd, { passive: true });
  window.addEventListener('pointercancel', onGestureEnd, { passive: true });

  shield.addEventListener('click', function (event) {
    if (holeOpen) return;
    event.preventDefault();
    forwardClick(event.clientX, event.clientY);
  });

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === RESIZE_TYPE) {
      applyHeight(Number(data.height));
      sendViewport();
      return;
    }
    if (data.type === HRECTS_TYPE && data.rects) {
      hrects = data.rects;
      return;
    }
    if (data.type === SCROLL_TYPE || data.type === 'bi13-highlevel-scroll') {
      scrollToOffset(data.offset);
    }
  });

  window.addEventListener('resize', function () {
    ping();
    sendWidth();
    sendViewport();
  });
  window.addEventListener('scroll', sendViewport, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      ping();
      sendWidth();
      sendViewport();
    });
    window.visualViewport.addEventListener('scroll', sendViewport, { passive: true });
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(function () {
      sendWidth();
      sendViewport();
    }).observe(wrap);
  }

  iframe.addEventListener('load', function () {
    ping();
    sendWidth();
    sendViewportNow();
    [50, 150, 400, 1000].forEach(function (ms) {
      setTimeout(function () {
        ping();
        sendWidth();
        sendViewportNow();
      }, ms);
    });
  });
  sendWidth();
  setTimeout(sendWidth, 100);
  setTimeout(sendWidth, 500);
})();
</script>

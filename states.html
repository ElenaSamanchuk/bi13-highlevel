<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BI13 · вид страницы до, во время и после продаж</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #131313; color: #eee; font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  p { margin: 0 0 8px; color: #bbb; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .tabs button { background: #222; color: #eee; border: 1px solid #444; padding: 8px 14px; cursor: pointer; font: inherit; }
  .tabs button[aria-pressed="true"] { background: #06f; border-color: #06f; }
  .now { font-size: 13px; color: #8ab4ff; }
  .frame { max-width: 1200px; margin: 0 auto; padding: 0 16px 24px; }
  iframe { width: 100%; height: 80vh; border: 1px solid #333; background: #1c1c1c; }
  .dev { display: flex; gap: 8px; margin: 0 0 8px; }
  .dev button { background: none; color: #bbb; border: 1px solid #333; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .dev button[aria-pressed="true"] { color: #fff; border-color: #888; }
  .phone iframe { width: 390px; max-width: 100%; display: block; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>Страница BI13 «Мобильная съёмка»: три вида</h1>
  <p>Страница сама переключается по времени Москвы. До 16.11 10:00: «старт продаж 16 ноября» и предзапись. С 16.11 10:00 до 30.11 23:59: «продажи открыты», тарифы и кнопки оплаты. С 01.12: «продажи закрыты» и предзапись на следующий поток.</p>
  <p class="now" id="now"></p>
  <div class="tabs" role="group" aria-label="Вид">
    <button data-s="before">До продаж</button>
    <button data-s="open">Продажи открыты</button>
    <button data-s="after">Продажи закрыты</button>
    <button data-s="">Как сейчас (по времени)</button>
  </div>
  <div class="dev" role="group" aria-label="Устройство">
    <button data-d="desk">Компьютер</button>
    <button data-d="phone">Телефон 390</button>
  </div>
</header>
<div class="frame" id="wrap"><iframe id="f" title="Страница BI13"></iframe></div>
<script>
  var OPEN = 1794812400000, CLOSE = 1796072400000;
  var q = new URLSearchParams(location.search);
  var s = q.has('sales') ? q.get('sales') : 'open', d = q.get('d') || 'desk';
  var now = Date.now();
  document.getElementById('now').textContent = 'Сейчас по времени: ' + (now < OPEN ? 'до продаж' : now < CLOSE ? 'продажи открыты' : 'продажи закрыты');
  function render() {
    document.getElementById('f').src = './' + (s ? '?sales=' + s : '');
    document.getElementById('wrap').className = 'frame' + (d === 'phone' ? ' phone' : '');
    document.querySelectorAll('[data-s]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.s === s)); });
    document.querySelectorAll('[data-d]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.d === d)); });
    var u = new URL(location.href); u.searchParams.set('sales', s); u.searchParams.set('d', d); history.replaceState(null, '', u);
  }
  document.querySelectorAll('[data-s]').forEach(function (b) { b.onclick = function () { s = b.dataset.s; render(); }; });
  document.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { d = b.dataset.d; render(); }; });
  render();
</script>
</body>
</html>
